name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production web app
        run: npm run build

      - name: Verify production build exists
        run: |
          test -f dist/index.html
          test -f dist/assets/aistudio/Kishu_Meri_Zindagani_6c52e3f4.mp3
          test -d dist/bundled-photos
          echo "Bundled photo files in dist: $(ls -1 dist/bundled-photos | wc -l)"
          echo "=== Verified dist/ build output ==="
          find dist -maxdepth 2 -type f | sort

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify Android project, Gradle wrapper, and synced assets exist
        run: |
          test -d android
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/app/build.gradle
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/assets/aistudio/Kishu_Meri_Zindagani_6c52e3f4.mp3
          echo "Bundled photo files in Android assets: $(ls -1 android/app/src/main/assets/public/bundled-photos | wc -l)"
          echo "=== Verified Android project & synced assets ==="
          find android/app/src/main/assets/public -maxdepth 2 -type f | sort

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK exists and contains bundled assets
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found or empty at $APK_PATH"
            ls -la android/app/build/outputs/apk/debug/ || true
            exit 1
          fi
          ls -lh "$APK_PATH"
          echo "Bundled photo files inside APK: $(unzip -l "$APK_PATH" | grep -c "assets/public/bundled-photos/")"
          echo "=== Verifying bundled offline assets inside APK ==="
          unzip -l "$APK_PATH" | grep "assets/public/" | head -n 50

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or update GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release edit v1.0.0 \
              --title "Kishu ❤️ Birthday App" \
              --notes "Offline Android APK build for Kishu ❤️ Birthday App (all bundled photos, audio, and local persistence included)."
            gh release upload v1.0.0 "$APK_PATH" --clobber
          else
            gh release create v1.0.0 "$APK_PATH" \
              --title "Kishu ❤️ Birthday App" \
              --notes "Offline Android APK build for Kishu ❤️ Birthday App (all bundled photos, audio, and local persistence included)." \
              --target "${{ github.sha }}"
          fi
          gh release view v1.0.0 --json url,tagName,name,assets
